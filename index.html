<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゲーム置き場</title>
    <style>
        body {
            font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
            margin: 40px;
            color: #333;
            line-height: 1.6;
        }
        h1 {
            font-size: 24px;
            border-bottom: 2px solid #ececec;
            padding-bottom: 10px;
        }
        .game-item {
            margin-top: 30px;
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 8px;
            max-width: 400px;
        }
        .game-desc {
            margin-bottom: 15px;
            font-size: 14px;
            color: #666;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #007bff;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            text-align: center;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>ゲーム置き場</h1>
    <p>作ったゲームを置いていきます</p>

    <div class="game-item">
        <p class="game-desc">次元を落とす相関係数ゲーム</p>
        <!-- ボタン -->
        <a href="https://yuupoccha.github.io/Correlation-Shift/" class="btn" target="_blank" rel="noopener noreferrer">
            Correlation Shift
        </a>
    </div>

</body>
</html>
